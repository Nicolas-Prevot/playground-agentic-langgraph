[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "playground-agentic-langgraph"
version = "0.1.0"
description = "Ten copy-ready LangGraph workflow patterns with runnable examples and tests: tool loops, memory, RAG, parallel workers, human approval, and resumable jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicolas PREVOT" }]
dependencies = [
  "langchain>=1.3,<2",
  "langgraph>=1.1,<2",
  "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/Nicolas-Prevot/playground-agentic-langgraph"
Issues = "https://github.com/Nicolas-Prevot/playground-agentic-langgraph/issues"

[project.optional-dependencies]
memory = ["langgraph-checkpoint-sqlite>=3,<4"]
mcp = ["langchain-mcp-adapters>=0.3,<1", "mcp>=1.20,<3"]
skills = ["PyYAML>=6,<7"]
deep-agent = ["deepagents>=0.5.4,<1"]
providers = ["langchain-litellm>=0.3,<1", "litellm>=1.80,<2"]
observability = [
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-configuration>=0.66b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-logging>=0.66b0,<1",
  "opentelemetry-instrumentation-genai-langchain>=1.2b0,<2",
]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.entry-points.opentelemetry_traces_exporter]
playground_safe = "playground_agentic.scenarios.s10_resumable.otel_sdk:SafeSpanExporter"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_agentic"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/.github",
  "/.env.example",
  "/.gitignore",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "src/playground_agentic/scenarios"]
markers = [
  "integration: exercises an optional adapter or persistence boundary",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv*", ".uv-cache", ".test-tmp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["**/tests"]
reportTypedDictNotRequiredAccess = false

[tool.coverage.run]
omit = ["*/tests/*"]
